[package]
name = "mystquarto-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Typed IR, readers, writers, and diagnostics powering the mystquarto MyST <-> Quarto converter"
license = "MIT-0"
repository = "https://github.com/ntluong95/myst-quarto-rustCLI"
keywords = ["myst", "quarto", "markdown", "converter"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
saphyr = "0.0.12"
saphyr-parser = "0.0.12"
thiserror = "2"

[dev-dependencies]
similar = "2"
