[package]
# The PUBLISHED package (RT-16): `cargo install mystquarto` must resolve
# this package name, not a binary name — see this crate's module docs and
# the phase spec's "Workspace" section.
name = "mystquarto"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Bidirectional MyST <-> Quarto converter"
license = "MIT-0"
publish = false

[features]
renderer-tests = []

[[bin]]
name = "mystquarto"
path = "src/main.rs"

[[bin]]
name = "myst2quarto"
path = "src/bin/myst2quarto.rs"

[[bin]]
name = "quarto2myst"
path = "src/bin/quarto2myst.rs"

[dependencies]
mystquarto-core = { path = "../mystquarto-core" }
clap = { version = "4", features = ["derive"] }
walkdir = "2.5"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
