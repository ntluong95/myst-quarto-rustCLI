# mystquarto conversion contract
#
# Machine-readable transcription of docs/dialect-comparison.md's mapping
# tables. Every conversion rule the implementation applies must trace to a
# row in this file (directive/structural/role/inline) or a row in the
# doc's prose sections that this file does not cover (§1, §4, §6, §7, §9,
# §11, §12 — policy and rationale, not row-wise mappings).
#
# `fidelity` is one of "exact" | "lossy" | "unmappable", mapping the doc's
# legend: ✅ -> exact, ⚠️ -> lossy, ❌ -> unmappable, ➖ (no equivalent,
# warn+preserve) -> unmappable.
#
# `ref` cites the exact section this row was transcribed from.
#
# Regenerate the sentinel-bounded tables in docs/dialect-comparison.md with
# `scripts/render-mapping-tables.py` (or `just regen-docs`) after editing
# this file. crates/mystquarto-core/tests/doc-sync.rs fails the build if the
# two drift apart.

# ---------------------------------------------------------------------------
# §2 Block constructs — non-structural rows (pure name/attribute swaps).
# Structural constructs (figure, table, list-table/csv-table, tab-set,
# include, notebook-embed, blockquote-attribution, iframe, proof/theorem,
# static code) need hand-written transform code and are recorded below in
# [[structural]] instead.
# ---------------------------------------------------------------------------

[[directive]]
myst = "code-cell"
quarto = "{python}"
fidelity = "exact"
note = "Language moves from argument to fence label"
ref = "§2"

[[directive]]
myst = ":tags: [remove-input]"
quarto = "#| echo: false"
fidelity = "exact"
ref = "§2"

[[directive]]
myst = ":tags: [remove-output]"
quarto = "#| output: false"
fidelity = "exact"
ref = "§2"

[[directive]]
myst = ":tags: [remove-cell]"
quarto = "#| include: false"
fidelity = "exact"
ref = "§2"

[[directive]]
myst = ":tags: [hide-input]"
quarto = "#| code-fold: true"
fidelity = "lossy"
note = "MyST hides; Quarto collapses. Not identical UX"
ref = "§2"

[[directive]]
myst = ":caption: text"
quarto = "#| fig-cap: \"text\""
fidelity = "exact"
ref = "§2"

[[directive]]
myst = ":label: fig:x"
quarto = "#| label: fig-x"
fidelity = "exact"
note = "Subject to §3 normalization"
ref = "§2"

[[directive]]
myst = "{image} url + :alt: :width:"
quarto = "![alt](url){width=\"X\"}"
fidelity = "exact"
ref = "§2"

[[directive]]
myst = "{math} + :label: eq:x"
quarto = "$$ … $$ {#eq-x}"
fidelity = "exact"
ref = "§2"

[[directive]]
myst = "$$ … $$"
quarto = "$$ … $$"
fidelity = "exact"
note = "Identical"
ref = "§2"

[[directive]]
