# ---------------------------------------------------------------------------
# §10 Legacy read-only surface — accepted when reading MyST, never emitted.
# ---------------------------------------------------------------------------

[[legacy_role]]
myst = "{cite}`key`"
modern_myst = "[@key]"
quarto = "[@key]"
fidelity = "exact"
legacy = true
ref = "§10"

[[legacy_role]]
myst = "{cite:t}`key`"
modern_myst = "@key"
quarto = "@key"
fidelity = "exact"
legacy = true
ref = "§10"

[[legacy_role]]
myst = "{cite:p}`key`"
modern_myst = "[@key]"
quarto = "[@key]"
fidelity = "exact"
legacy = true
ref = "§10"

[[legacy_role]]
myst = "{numref}`fig-x`"
modern_myst = "@fig-x"
quarto = "@fig-x"
fidelity = "exact"
legacy = true
ref = "§10"

[[legacy_role]]
myst = "{numref}`Figure %s <fig-x>`"
modern_myst = "[Figure %s](#fig-x)"
quarto = "[Fig @fig-x]"
fidelity = "lossy"
note = "Custom prefix text (%s) not preserved; Quarto emits a fixed 'Fig' prefix"
legacy = true
ref = "§10"

[[legacy_role]]
myst = "{ref}`label`"
modern_myst = "@label / [](#label)"
quarto = "@label"
fidelity = "exact"
legacy = true
ref = "§10"

[[legacy_role]]
myst = "{eq}`label`"
modern_myst = "@eq-label"
quarto = "@eq-label"
fidelity = "exact"
legacy = true
ref = "§10"

[[legacy_role]]
myst = "{doc}`path`"
modern_myst = "[path](path.md)"
quarto = "[path](path.qmd)"
fidelity = "exact"
legacy = true
ref = "§10"

[[legacy_role]]
myst = ":name: directive option"
modern_myst = ":label:"
quarto = "{#id}"
fidelity = "exact"
legacy = true
ref = "§10"

# ---------------------------------------------------------------------------
# §3.3 Prefix rules — the colon-prefix → hyphen-prefix normalization table.
# Quarto's registered type prefixes (§3.3), each with its MyST colon-form
# source, plus the documented tab:→tbl- exception and the general _→- rule.
# Normalization is not injective (§3.5), so every row needs the sidecar map
# (.mystquarto/labels.json) to recover the original spelling on reverse
# conversion — hence "lossy" throughout.
