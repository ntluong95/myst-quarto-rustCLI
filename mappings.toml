# ---------------------------------------------------------------------------
# §5 Inline constructs — role syntax (`` {name}`...` ``).
# ---------------------------------------------------------------------------

[[role]]
myst = "eval"
quarto = "`{python} expr`"
fidelity = "exact"
note = "Python"
ref = "§5"

[[role]]
myst = "eval"
quarto = "`{r} expr`"
fidelity = "exact"
note = "R, Jupyter kernel"
ref = "§5"

[[role]]
quarto = "`r expr`"
fidelity = "unmappable"
note = "knitr-only. See §6"
ref = "§5"

[[role]]
myst = "abbr"
fidelity = "unmappable"
note = "Emit raw <abbr> + warn"
ref = "§5"

[[role]]
myst = "del"
quarto = "~~x~~"
fidelity = "exact"
note = "Also plain ~~x~~ syntax in MyST"
ref = "§5"

[[role]]
myst = "u"
quarto = "[x]{.underline}"
fidelity = "exact"
ref = "§5"

[[role]]
myst = "sc"
quarto = "[x]{.smallcaps}"
fidelity = "exact"
ref = "§5"

[[role]]
myst = "sub"
quarto = "~x~"
fidelity = "exact"
note = "Also plain ~x~ syntax in MyST"
ref = "§5"

[[role]]
myst = "sup"
quarto = "^x^"
fidelity = "exact"
note = "Also plain ^x^ syntax in MyST"
ref = "§5"

[[role]]
myst = "kbd"
quarto = "[Ctrl-C]{.kbd}"
fidelity = "lossy"
note = "No Quarto semantic"
ref = "§5"

[[role]]
myst = "doc"
legacy = true
fidelity = "unmappable"
note = "read-only → [path](path.qmd)"
ref = "§5"

# ---------------------------------------------------------------------------
# §5 Inline constructs — plain syntax, identical or near-identical.
# ---------------------------------------------------------------------------

[[inline]]
myst = "[text](./other.md)"
quarto = "[text](./other.qmd)"
fidelity = "exact"
note = "Extension rewrite"
ref = "§5"

[[inline]]
myst = "[](./references.bib)"
quarto = "[references.bib](./references.bib)"
fidelity = "lossy"
note = "MyST auto-fills text; Quarto renders empty"
ref = "§5"

[[inline]]
myst = "[^label] + [^label]: text"
quarto = "[^label] + [^label]: text"
fidelity = "exact"
note = "identical"
ref = "§5"

[[inline]]
myst = "[Label]: https://url"
quarto = "[Label]: https://url"
fidelity = "exact"
note = "identical"
ref = "§5"

[[inline]]
myst = "\\ at end of line"
quarto = "\\ at end of line"
fidelity = "exact"
note = "identical"
ref = "§5"

