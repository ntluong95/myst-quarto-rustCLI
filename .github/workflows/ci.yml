name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --dev
      - run: uv run pytest tests/ -v
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No third-party toolchain action needed: `rust-toolchain.toml` at the
      # repo root pins the exact channel and components (clippy, rustfmt),
      # and GitHub's ubuntu-latest runners ship rustup preinstalled — `rustup
      # show` resolves the override file and installs that toolchain (with
      # its declared components) on first use.
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
